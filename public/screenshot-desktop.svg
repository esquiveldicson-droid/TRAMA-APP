  <text x="85" y="48" font-family="'Nunito', sans-serif" font-size="24" font-weight="900" fill="#E07A5F" text-anchor="middle">T</text>
  
  <text x="125" y="44" font-family="'Nunito', sans-serif" font-size="24" font-weight="900" fill="#2C2724">TRAMA APP</text>
  <rect x="275" y="27" width="70" height="24" rx="6" fill="#E07A5F" fill-opacity="0.15"/>
  <text x="310" y="43" font-family="'Nunito', sans-serif" font-size="12" font-weight="700" fill="#E07A5F" text-anchor="middle">PRIVADA</text>

  <!-- Navigation items -->
  <text x="750" y="46" font-family="'Nunito', sans-serif" font-size="16" font-weight="800" fill="#E07A5F">Muro</text>
  <text x="840" y="46" font-family="'Nunito', sans-serif" font-size="16" font-weight="600" fill="#736B63">Calendario</text>
