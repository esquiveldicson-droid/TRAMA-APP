  <text x="1060" y="46" font-family="'Nunito', sans-serif" font-size="16" font-weight="600" fill="#736B63">Ajustes</text>
  <circle cx="1180" cy="40" r="20" fill="#E07A5F"/>
  <text x="1180" y="46" font-family="'Nunito', sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">P</text>

  <!-- Two Column Layout -->
  <!-- Left Column: Status & Challenge -->
  <rect x="140" y="120" width="460" height="600" rx="32" fill="#FFFDF9" stroke="#EFE7DA" stroke-width="2"/>
  <text x="175" y="170" font-family="'Nunito', sans-serif" font-size="20" font-weight="800" fill="#2C2724">Estados de Hoy</text>
  
  <circle cx="210" cy="230" r="28" fill="#E07A5F" fill-opacity="0.2"/>
  <text x="210" y="238" font-family="'Nunito', sans-serif" font-size="18" font-weight="700" fill="#E07A5F" text-anchor="middle">P</text>
  <text x="260" y="225" font-family="'Nunito', sans-serif" font-size="16" font-weight="800" fill="#2C2724">Papá Roberto</text>
  <text x="260" y="245" font-family="'Nunito', sans-serif" font-size="14" font-weight="600" fill="#736B63">☕ Preparando café y organizando asado</text>

  <circle cx="210" cy="310" r="28" fill="#5B8266" fill-opacity="0.2"/>
  <text x="210" y="318" font-family="'Nunito', sans-serif" font-size="18" font-weight="700" fill="#5B8266" text-anchor="middle">M</text>
  <text x="260" y="305" font-family="'Nunito', sans-serif" font-size="16" font-weight="800" fill="#2C2724">Mamá Carmen</text>
  <text x="260" y="325" font-family="'Nunito', sans-serif" font-size="14" font-weight="600" fill="#736B63">🥧 Horneando la tarta de la nonna</text>

