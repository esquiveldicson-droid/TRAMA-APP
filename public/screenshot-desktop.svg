<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" fill="none">
  <!-- Desktop App Background -->
  <rect width="1280" height="800" fill="#FAF6F0"/>

  <!-- Top App Header -->
  <rect width="1280" height="80" fill="#FFFDF9" stroke="#EFE7DA" stroke-width="2"/>
