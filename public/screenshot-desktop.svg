  <rect x="630" y="120" width="510" height="600" rx="32" fill="#FFFDF9" stroke="#EFE7DA" stroke-width="2"/>
  <text x="670" y="170" font-family="'Nunito', sans-serif" font-size="20" font-weight="800" fill="#2C2724">Muro Familiar</text>
  <rect x="670" y="200" width="430" height="240" rx="20" fill="#FAF6F0"/>
  <text x="885" y="325" font-family="'Nunito', sans-serif" font-size="20" font-weight="700" fill="#736B63" text-anchor="middle">📸 Recuerdos Compartidos de la Familia</text>
  <text x="670" y="480" font-family="'Nunito', sans-serif" font-size="16" font-weight="700" fill="#2C2724">Vacaciones juntos en la montaña</text>
  <text x="670" y="505" font-family="'Nunito', sans-serif" font-size="14" font-weight="600" fill="#736B63">Publicado ayer • 8 comentarios • 5 reacciones</text>
