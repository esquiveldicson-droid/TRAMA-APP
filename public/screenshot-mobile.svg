<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1334" width="750" height="1334" fill="none">
  <!-- Phone Background -->
  <rect width="750" height="1334" fill="#FAF6F0"/>

  <!-- Status Bar -->
  <rect width="750" height="60" fill="#FAF6F0"/>
  <text x="50" y="42" font-family="'Nunito', sans-serif" font-size="24" font-weight="700" fill="#2C2724">9:41</text>
  <circle cx="680" cy="35" r="8" fill="#2C2724"/>
  <rect x="696" y="27" width="24" height="16" rx="4" fill="#2C2724"/>

  <!-- App Header -->
  <rect y="60" width="750" height="110" fill="#FAF6F0" stroke="#EFE7DA" stroke-width="2"/>
  <rect x="40" y="80" width="70" height="70" rx="20" fill="#FFFDF9" stroke="#EFE7DA" stroke-width="2"/>
  <text x="75" y="125" font-family="'Nunito', sans-serif" font-size="32" font-weight="900" fill="#E07A5F" text-anchor="middle">T</text>
  
  <text x="130" y="112" font-family="'Nunito', sans-serif" font-size="32" font-weight="900" fill="#2C2724">TRAMA</text>
  <rect x="250" y="90" width="80" height="28" rx="8" fill="#E07A5F" fill-opacity="0.15"/>
  <text x="290" y="109" font-family="'Nunito', sans-serif" font-size="16" font-weight="700" fill="#E07A5F" text-anchor="middle">PRIVADA</text>
  <text x="130" y="138" font-family="'Nunito', sans-serif" font-size="20" font-weight="600" fill="#736B63">Nuestra Familia</text>

  <!-- Status Strip (Avatars) -->
  <rect x="40" y="200" width="100" height="140" rx="30" fill="#FFFDF9" stroke="#EFE7DA" stroke-width="2"/>
  <circle cx="90" cy="255" r="35" fill="#E07A5F" fill-opacity="0.2"/>
  <text x="90" y="265" font-family="'Nunito', sans-serif" font-size="24" font-weight="700" fill="#E07A5F" text-anchor="middle">P</text>
  <text x="90" y="315" font-family="'Nunito', sans-serif" font-size="18" font-weight="700" fill="#2C2724" text-anchor="middle">Papá</text>

  <rect x="160" y="200" width="100" height="140" rx="30" fill="#FFFDF9" stroke="#EFE7DA" stroke-width="2"/>
  <circle cx="210" cy="255" r="35" fill="#5B8266" fill-opacity="0.2"/>
  <text x="210" y="265" font-family="'Nunito', sans-serif" font-size="24" font-weight="700" fill="#5B8266" text-anchor="middle">M</text>
  <text x="210" y="315" font-family="'Nunito', sans-serif" font-size="18" font-weight="700" fill="#2C2724" text-anchor="middle">Mamá</text>

  <rect x="280" y="200" width="100" height="140" rx="30" fill="#FFFDF9" stroke="#EFE7DA" stroke-width="2"/>
  <circle cx="330" cy="255" r="35" fill="#4361EE" fill-opacity="0.2"/>
  <text x="330" y="265" font-family="'Nunito', sans-serif" font-size="24" font-weight="700" fill="#4361EE" text-anchor="middle">L</text>
  <text x="330" y="315" font-family="'Nunito', sans-serif" font-size="18" font-weight="700" fill="#2C2724" text-anchor="middle">Lucas</text>

  <!-- Feed Post Card 1 -->
  <rect x="40" y="370" width="670" height="420" rx="36" fill="#FFFDF9" stroke="#EFE7DA" stroke-width="2"/>
  <circle cx="95" cy="425" r="30" fill="#E07A5F"/>
  <text x="95" y="435" font-family="'Nunito', sans-serif" font-size="22" font-weight="700" fill="#FFF" text-anchor="middle">P</text>
  <text x="145" y="420" font-family="'Nunito', sans-serif" font-size="26" font-weight="800" fill="#2C2724">Papá Roberto</text>
  <text x="145" y="445" font-family="'Nunito', sans-serif" font-size="18" font-weight="600" fill="#736B63">El Asador Mayor • Hace 2h</text>
  
  <text x="75" y="500" font-family="'Nunito', sans-serif" font-size="24" font-weight="600" fill="#2C2724">
    ¡El fuego ya está prendido para el asado familiar de este domingo!
  </text>
  <rect x="75" y="530" width="600" height="190" rx="24" fill="#EFE7DA" fill-opacity="0.6"/>
  <text x="375" y="635" font-family="'Nunito', sans-serif" font-size="32" font-weight="700" fill="#736B63" text-anchor="middle">🥩 Asado en Familia</text>

  <text x="75" y="755" font-family="'Nunito', sans-serif" font-size="22" font-weight="700" fill="#E07A5F">❤️ 5 Amor familiar</text>
  <text x="260" y="755" font-family="'Nunito', sans-serif" font-size="22" font-weight="700" fill="#5B8266">🥘 ¡Guárdame!</text>

  <!-- Daily Challenge Card -->
  <rect x="40" y="820" width="670" height="260" rx="36" fill="#FAF0E6" stroke="#E07A5F" stroke-width="2" stroke-opacity="0.3"/>
  <text x="75" y="870" font-family="'Nunito', sans-serif" font-size="20" font-weight="800" fill="#E07A5F" letter-spacing="1">✨ PREGUNTA DEL DÍA</text>
  <text x="75" y="920" font-family="'Nunito', sans-serif" font-size="26" font-weight="800" fill="#2C2724">
    "¿Cuál ha sido la mejor sobremesa de nuestras vidas?"
  </text>
  <rect x="75" y="960" width="600" height="80" rx="20" fill="#FFFDF9"/>
  <text x="105" y="1008" font-family="'Nunito', sans-serif" font-size="20" font-weight="600" fill="#736B63">Escribe tu respuesta familiar...</text>

  <!-- Bottom Navigation Bar -->
  <rect y="1200" width="750" height="134" fill="#FFFDF9" stroke="#EFE7DA" stroke-width="2"/>
  <text x="94" y="1265" font-family="'Nunito', sans-serif" font-size="20" font-weight="800" fill="#E07A5F" text-anchor="middle">Muro</text>
  <text x="281" y="1265" font-family="'Nunito', sans-serif" font-size="20" font-weight="600" fill="#736B63" text-anchor="middle">Calendario</text>
  <text x="469" y="1265" font-family="'Nunito', sans-serif" font-size="20" font-weight="600" fill="#736B63" text-anchor="middle">Tesoro</text>
  <text x="656" y="1265" font-family="'Nunito', sans-serif" font-size="20" font-weight="600" fill="#736B63" text-anchor="middle">Perfil</text>
</svg>
